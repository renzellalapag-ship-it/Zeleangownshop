<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Dashboard — Zelean Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/admin.css?v=6" />
</head>
<body class="admin-body">
  <div class="demo-banner">
    <strong>Admin dashboard.</strong> Signed in with Supabase Auth — product data loads live from your Supabase database.
  </div>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo" aria-hidden="true">Z</span>
        <span>
          <span class="sidebar__name">Zelean</span><br />
          <span class="sidebar__tag">Admin</span>
        </span>
      </div>

      <nav class="sidebar__nav" aria-label="Admin">
        <a class="sidebar__link is-active" href="index.html">Dashboard</a>
        <a class="sidebar__link" href="index.html#products">Products</a>
        <a class="sidebar__link" href="../index.html" target="_blank" rel="noopener">View Store ↗</a>
      </nav>

      <div class="sidebar__footer">
        <button class="btn btn-outline btn-sm btn-block" id="logout-btn" type="button">
          Log out
        </button>
      </div>
    </aside>

    <!-- Dimmed backdrop (mobile): tap to close the sidebar drawer -->
    <div class="admin-backdrop" id="admin-backdrop" aria-hidden="true"></div>

    <!-- Main -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Toggle menu">☰</button>
          <div>
            <h2>Dashboard</h2>
            <p id="welcome-line">Welcome back — manage your catalogue.</p>
          </div>
        </div>
        <button class="btn btn-primary" id="add-product-btn" type="button">+ Add Product</button>
      </div>

      <!-- Stats -->
      <section class="stat-grid" id="stats" aria-label="Product summary"></section>

      <!-- Products table -->
      <section class="panel" id="products">
        <div class="panel__toolbar">
          <div class="grow">
            <input class="input" id="admin-search" type="search" placeholder="Search by name, SKU, category…" autocomplete="off" />
          </div>
          <select class="select" id="admin-category" style="max-width:200px;">
            <option value="">All categories</option>
          </select>
          <button class="btn btn-outline btn-sm" id="admin-clear" type="button">Clear</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Type</th>
                <th>Price</th>
                <th>Availability</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal host for the product form (rendered by js/product-form.js) -->
  <div id="modal-root"></div>
  <!-- Toast host -->
  <div id="toast-root"></div>

  <!-- Admin scripts: config → Supabase lib → helpers → auth → data → dashboard → form -->
  <!-- config.js + Supabase library must load before admin-auth.js so real auth works. -->
  <!-- sample-data.js provides the seed products for the demo store. -->
  <script src="../js/config.js?v=6"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/sample-data.js?v=6"></script>
  <script src="js/admin-utils.js?v=6"></script>
  <script src="js/admin-auth.js?v=6"></script>
  <script src="js/admin-data.js?v=6"></script>
  <script src="js/product-form.js?v=6"></script>
  <script src="js/admin.js?v=6"></script>
</body>
</html>
